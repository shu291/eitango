<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音量テスト</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; background: #fafaf7; color: #222; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 13px; line-height: 1.6; margin: 0 0 12px; color: #555; }
  button { display: block; width: 100%; min-height: 48px; margin: 0 0 8px; font-size: 16px; border: 1px solid #4f46e5; background: #fff; color: #4f46e5; border-radius: 8px; }
  button:active { background: #4f46e5; color: #fff; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
</style>
</head>
<body>
<h1>音量テスト</h1>
<p>端末の音量は、いつも使う大きさ（最大など）にしてから押してください。上から順に押して、<b>前より小さくなったか</b>を聞き比べます。<b>いちばん小さくて、まだ聞こえるボタン</b>と、聞こえなくなった最初のボタンを教えてください。</p>
<div id="list"></div>
<button id="all" style="margin-top:16px;border-color:#888;color:#444">上から順に全部（約40秒）</button>
<script>
  const VOLS = [0.1, 0.05, 0.03, 0.02, 0.015, 0.012, 0.01, 0.008, 0.006, 0.005, 0.004, 0.003, 0.002, 0.001];
  const synth = window.speechSynthesis;
  const speak = (v) => new Promise((resolve) => {
    synth.cancel();
    const u = new SpeechSynthesisUtterance('abundant. volume ' + v);
    u.lang = 'en-US';
    u.volume = v;
    u.onend = u.onerror = resolve;
    synth.speak(u);
  });
  const list = document.getElementById('list');
  VOLS.forEach((v) => {
    const b = document.createElement('button');
    b.textContent = '音量 ' + v;
    b.onclick = () => speak(v);
    list.appendChild(b);
  });
  document.getElementById('all').onclick = async () => {
    for (const v of VOLS) { await speak(v); await new Promise((r) => setTimeout(r, 600)); }
  };
</script>
</body>
</html>
